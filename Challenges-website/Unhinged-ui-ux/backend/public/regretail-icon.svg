<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 680" width="512" height="512">
  <style>
    .cart-body { fill: none; stroke: #f5f5f5; stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; }
    .cart-fill { fill: #2c2c4a; }
    .accent { fill: #e74c3c; }
    .pricetag { fill: #f39c12; }
    .eye { fill: #f5f5f5; }
    .pupil { fill: #1a1a2e; }
    .mouth { fill: none; stroke: #f5f5f5; stroke-width: 10; stroke-linecap: round; }
    .spark { fill: none; stroke: #f39c12; stroke-width: 6; stroke-linecap: round; }
    .tear { fill: #74b9ff; }
    .sweat { fill: none; stroke: #74b9ff; stroke-width: 8; stroke-linecap: round; }
    .strikethrough { fill: none; stroke: #e74c3c; stroke-width: 7; stroke-linecap: round; }
    .badge-txt { fill: #fff; font-family: 'Comic Sans MS', cursive; font-weight: 900; }
    .label { fill: #f5f5f5; font-family: 'Comic Sans MS', cursive; font-weight: 900; font-size: 58px; }
    .sublabel { fill: #aaa; font-family: 'Comic Sans MS', cursive; font-size: 26px; }
  </style>

  <!-- Background circle -->
  <circle cx="340" cy="310" r="290" fill="#1a1a2e"/>
  <circle cx="340" cy="310" r="290" fill="none" stroke="#2c2c4a" stroke-width="14"/>
  <line x1="100" y1="310" x2="580" y2="310" stroke="#2c2c4a" stroke-width="2"/>
  <line x1="340" y1="80" x2="340" y2="540" stroke="#2c2c4a" stroke-width="2"/>

  <!-- Cart handle + body -->
  <polyline points="130,175 175,175 230,390 510,390 540,255 205,255" class="cart-body"/>
  <polygon points="205,255 510,255 480,385 240,385" class="cart-fill"/>
  <line x1="205" y1="255" x2="540" y2="255" stroke="#f5f5f5" stroke-width="18" stroke-linecap="round"/>

  <!-- Left eye -->
  <ellipse cx="300" cy="310" rx="22" ry="22" class="eye"/>
  <ellipse cx="308" cy="316" rx="11" ry="11" class="pupil"/>
  <circle cx="299" cy="306" r="5" fill="#f5f5f5"/>

  <!-- Right eye (X) -->
  <line x1="393" y1="290" x2="423" y2="320" stroke="#f5f5f5" stroke-width="10" stroke-linecap="round"/>
  <line x1="423" y1="290" x2="393" y2="320" stroke="#f5f5f5" stroke-width="10" stroke-linecap="round"/>

  <!-- Sad mouth -->
  <path d="M280 360 Q340 330 410 360" class="mouth"/>

  <!-- Sweat -->
  <path d="M455 240 Q462 228 455 218" class="sweat"/>
  <path d="M475 255 Q484 238 474 225" class="sweat"/>

  <!-- Tear -->
  <ellipse cx="288" cy="343" rx="8" ry="13" class="tear"/>

  <!-- Left wheel -->
  <circle cx="265" cy="418" r="38" fill="#1a1a2e" stroke="#f5f5f5" stroke-width="14"/>
  <circle cx="265" cy="418" r="12" fill="#f5f5f5"/>

  <!-- Right wheel (broken) -->
  <circle cx="465" cy="422" r="38" fill="#1a1a2e" stroke="#f5f5f5" stroke-width="7" stroke-dasharray="14 9"/>
  <circle cx="465" cy="422" r="12" fill="#f5f5f5"/>
  <path d="M451 408 L468 422 L458 436" fill="none" stroke="#e74c3c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Price tag -->
  <rect x="490" y="180" width="110" height="58" rx="8" class="pricetag"/>
  <circle cx="490" cy="209" r="8" fill="#1a1a2e"/>
  <line x1="490" y1="209" x2="510" y2="195" stroke="#f39c12" stroke-width="5" stroke-linecap="round"/>
  <text x="545" y="202" text-anchor="middle" class="badge-txt" font-size="15">$999</text>
  <text x="545" y="224" text-anchor="middle" class="badge-txt" font-size="15">→ $998</text>
  <line x1="500" y1="200" x2="596" y2="200" class="strikethrough"/>

  <!-- Only 1 left badge -->
  <rect x="138" y="175" width="145" height="38" rx="19" class="accent"/>
  <text x="211" y="200" text-anchor="middle" class="badge-txt" font-size="15">🔥 ONLY 1 LEFT!</text>

  <!-- Sparks -->
  <line x1="590" y1="280" x2="615" y2="265" class="spark"/>
  <line x1="600" y1="295" x2="630" y2="295" class="spark"/>
  <line x1="590" y1="310" x2="612" y2="328" class="spark"/>
  <line x1="90" y1="340" x2="65" y2="325" class="spark"/>
  <line x1="82" y1="360" x2="55" y2="360" class="spark"/>
  <line x1="90" y1="378" x2="68" y2="394" class="spark"/>

  <!-- Brand text -->
  <text x="340" y="520" text-anchor="middle" class="label">REGRETAIL</text>
  <text x="340" y="555" text-anchor="middle" class="sublabel">™ where shopping goes wrong</text>
</svg>

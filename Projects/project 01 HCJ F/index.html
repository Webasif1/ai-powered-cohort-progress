<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Productivity DashboardClose=</title>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css"
      rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="main">
      <nav></nav>
      <section class="allElems">
        <div class="todo elem" id="0">
          <img
            src="https://images.unsplash.com/photo-1678986718987-76f0b9357e0f?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt="" />
          <h2>Todo list</h2>
        </div>
        <div class="daily elem" id="1">
          <img
            src="https://images.unsplash.com/photo-1718202248212-d82688e7dfb1?q=80&w=764&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt="" />
          <h2>Daily planner</h2>
        </div>
        <div class="moti elem" id="2">
          <img
            src="https://plus.unsplash.com/premium_photo-1671199850163-3558258bdb74?q=80&w=627&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt="" />
          <h2>Motivation Timer</h2>
        </div>
        <div class="pomo elem" id="3">
          <img
            src="https://images.unsplash.com/photo-1634549709262-508c47d4c229?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt="" />
          <h2>Pomodoro timer</h2>
        </div>
        <div class="goals elem" id="4">
          <img
            src="https://images.unsplash.com/photo-1668450433152-e56d7e8fe4ee?q=80&w=1064&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt="" />
          <h2>Daily goals</h2>
        </div>
      </section>

      <section class="fullElem todo-list-fullpage">
        <button class="back">Close</button>
        <h2>Your Task List</h2>

        <div class="todo-container">
          <div class="addTask">
            <form>
              <h3>Add Task</h3>
              <input
                type="text"
                placeholder="Enter Task"
                name=""
                id="task-input" />
              <textarea placeholder="Enter Details" name="" id=""></textarea>
              <div class="mark-imp">
                <input type="checkbox" name="" id="check" />
                <label for="check">Mark as important!</label>
              </div>
              <button>Add Task</button>
            </form>
          </div>
          <div class="allTask">
            <!-- <div class="task">
                        <h5>Go to the gym</h5>
                        <button>Mark as completed</button>
                    </div> -->
          </div>
        </div>
      </section>

      <section class="fullElem daily-planner-fullpage">
        <button class="back" id="1">Close</button>
        <h2>Your day to be more productive</h2>

        <div class="day-planner">
          <!-- <div class="day-planner-time">
                        <p>7:00 - 8:00</p>
                        <input type="text" placeholder="...">
                    </div> -->
        </div>
      </section>

      <section class="fullElem motivational-fullpage">
        <button class="back">Close</button>
        <div class="motivation-fullPageContainer">
          <div class="motivational-container">
            <div class="motivation-wrapper">
              <img src="./quotes.png" alt="" />
              <div class="motivation-1">
                <h2>Quotes of the day</h2>
              </div>
              <div class="motivation-2">
                <h3>Loading...</h3>
              </div>
              <div class="motivation-3">
                <h4>Loading...</h4>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="fullElem pomodoro-fullpage">
        <button class="back">Close</button>
        <h1>Pomodoro timer</h1>
      </section>

      <section class="fullElem daily-goals-fullpage">
        <button class="back">Close</button>
        <h1>Daily goals</h1>
      </section>
    </div>
    <script src="./app.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="container">
<div class="formContainer">
  <form id="form" class="user-form">
    <h2>Create User</h2>

    <label for="name">Name</label>
    <input id="name" type="text" placeholder="Enter name" />

    <label for="profession">Profession</label>
    <input id="profession" type="text" placeholder="Enter profession" />

    <label for="image">Image URL</label>
    <input id="image" type="text" placeholder="Paste image link" />

    <label for="bio">Bio</label>
    <textarea id="bio" placeholder="Write a short bio..."></textarea>

     <input id="submit" type="submit" value="Submit">
  </form>
  </div>

  <div class="userContainer">

  <div class="user-details" id="details">
    <h2>User Details</h2>
    <img id="d-image" src="https://plus.unsplash.com/premium_photo-1689977968861-9c91dbb16049?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NXx8bWFufGVufDB8fDB8fHww" alt="User Image" />
    <p><strong>Name:</strong> <span id="d-name">Asif</span></p>
    <p><strong>Profession:</strong> <span id="d-profession">Dev</span></p>
    <p><strong>Bio:</strong> <span id="d-bio">I love coding...</span></p>
  </div>

  </div>

</div>

    <script src="./script.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link rel="stylesheet" href="./style.css" />
        <link
            href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css"
            rel="stylesheet"
        />
    </head>
    <body>
      <!-- Main Screen Start in Html -->
      <main id="screen">
        <!-- Bottom Part Start  -->
        <div class="bottom_part">
          <!-- Bottom Left Part Start  -->
          <div class="bottom_left_part">
            <!-- window button st  -->
            <button id="window"><i class="ri-windows-fill"></i></button>
            <!-- window button en  -->
            <button id="search"><i class="ri-search-line"></i></button>
            <button id="task_bar"><i class="ri-stacked-view"></i></button>
          </div>
          <!-- Bottom Left Part End  -->
          <!-- Bottom Right Part Start  -->
          <div class="bottom_right_part">
            <button id="history"><i class="ri-arrow-up-s-line"></i></button>
            <button id="meet"><i class="ri-video-on-line"></i></button>
            <button id="update"><i class="ri-loader-2-line"></i></button>
            <button id="sound"><i class="ri-volume-up-line"></i></button>
            <button id="internet"><i class="ri-computer-line"></i></button>
            <div class="time">
              <p>11:00pm</p>
              <p>12/10/2025</p>
            </div>
            <button id="notifications"><i class="ri-chat-2-line"></i></button>
          </div>
        </div>
        <!-- Bottom Right Part End  -->
        <div id="left_window">
          <div id="window_left">
            <div class="start">
              <i class="ri-menu-fill"></i>
            </div>
            <div class="icons">
              <i class="ri-user-line"></i>
              <i class="ri-file-3-line"></i>
              <i class="ri-image-line"></i>
              <i class="ri-settings-4-line"></i>
              <i class="ri-shut-down-line"></i>
            </div>
          </div>
          <div id="window_middle"></div>
          <div id="window_right"></div>
        </div>
        <!-- Bottom Part End  -->
      </main>
      <!-- Main Screen End in Html -->
      <script src="./script.js"></script>
    </body>
</html>
